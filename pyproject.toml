[project]
name = "tcalab"
version = "0.1.0"
description = "Pre-trade transaction-cost models for crypto perps — every parameter sourced, calibrated, or reconciled against real market data"
requires-python = ">=3.11"
dependencies = [
    "polars>=1.10,<2",
    "numpy>=1.26",
    "requests>=2.31",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tcalab"]

[tool.pytest.ini_options]
markers = [
    "network: hits external services; excluded by default (run with -m network)",
]
addopts = "-m 'not network'"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests", "studies"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = ["tcalab", "tests"]
